[build]
  publish = "."
  command = ""

# Enable Netlify Identity + Git Gateway so the CMS admin can log in
# and commit content changes directly to GitHub without touching code.
[build.environment]
  NODE_VERSION = "18"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options       = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

# Custom admin panel CSP
[[headers]]
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://identity.netlify.com https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://api.netlify.com https://auth.netlify.com https://*.netlify.app https://*.github.com https://github.com https://raw.githubusercontent.com; worker-src blob:; frame-src 'self' https://woosterstreet.netlify.app https://woosterstreetcatering.com"

# Cache static assets
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Always serve fresh content.json so CMS edits are reflected immediately
[[headers]]
  for = "/content.json"
  [headers.values]
    Cache-Control = "public, max-age=60, s-maxage=60"
